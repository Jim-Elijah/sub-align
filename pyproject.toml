[project]
name = "sub-align"
version = "0.1.0"
description = "Align LRC/SRT subtitles to audio/video using WhisperX forced alignment"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jim-Elija", email = "willelijah.x@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["subtitle", "whisperx", "alignment", "srt", "lrc", "forced-alignment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# WhisperX pulls PyTorch; install an extra after matching torch (CPU/CUDA) if needed.
align = ["whisperx>=3.3.0"]
cpu = ["whisperx>=3.3.0"]
gpu = ["whisperx>=3.3.0"]

[project.scripts]
sub-align = "sub_align.cli:main"

[project.urls]
Homepage = " https://github.com/Jim-Elijah/sub-align"
Repository = "https://github.com/Jim-Elijah/sub-align"
Issues = "https://github.com/Jim-Elijah/sub-align/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "commitizen>=4.16.5",
    "pre-commit>=4.6.1",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "/.gitignore",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sub_align"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download models or run real alignment",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"
update_changelog_on_bump = true
